services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fastcas
      POSTGRES_USER: fastcas
      POSTGRES_PASSWORD: ${FASTCAS_DB_PASSWORD:?set FASTCAS_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastcas -d fastcas"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - fastcas-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  fastcas:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FASTCAS_ENV: development
      FASTCAS_LISTEN: 0.0.0.0:8900
      FASTCAS_ISSUER: ${FASTCAS_ISSUER:-http://127.0.0.1:8900}
      FASTCAS_DATABASE_URL: postgres://fastcas:${FASTCAS_DB_PASSWORD:?set FASTCAS_DB_PASSWORD}@postgres:5432/fastcas?sslmode=disable
      FASTCAS_KEYS_DIR: /state/keys
      FASTCAS_UI_DIR: /opt/fastcas/web
    ports:
      - 127.0.0.1:8900:8900
    volumes:
      - fastcas-keys:/state
    restart: unless-stopped

volumes:
  fastcas-postgres:
  fastcas-keys:
